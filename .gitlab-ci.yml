workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$/'
    - if: '$CI_COMMIT_MESSAGE =~ /\[ci run\]/'
    - when: never

stages:
  - test
  - quality
  - package

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

test:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.10", "3.11", "3.12", "3.13"]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends graphviz
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev,web,graph_nx]"
  script:
    - python -m pytest -q --ignore=tests/web/test_browser.py --junitxml=pytest.xml
  artifacts:
    when: always
    reports:
      junit: pytest.xml

schema-sync:
  stage: quality
  image: python:3.12-slim
  variables:
    R3XA_SPEC_URL: "https://gitlab.com/photomechanics/R3XA_SPEC.git"
    # Pin validation to the published schema tag instead of a moving branch.
    R3XA_SPEC_REF: "2026.9.18"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
    - python -m pip install --upgrade pip
    - python -m pip install "pytest>=8.0"
  script:
    # The packaged schema is a copy of the one published by R3XA_SPEC. Compare
    # against a fresh clone so a divergence fails here instead of surfacing as a
    # validation error downstream.
    - git clone --depth 1 --branch "$R3XA_SPEC_REF" "$R3XA_SPEC_URL" /tmp/R3XA_SPEC
    # Guard against the test skipping itself if the clone were ever incomplete.
    - test -f /tmp/R3XA_SPEC/schema.json
    - R3XA_SPEC_PATH=/tmp/R3XA_SPEC python -m pytest -q tests/test_schema_sync.py

docs:
  stage: quality
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[docs]"
  script:
    - python tools/generate_spec.py r3xa_api/resources/schema.json docs/specification.md
    - python -m sphinx -W --keep-going -b html docs docs/_build/html

browser:
  stage: quality
  image: python:3.12-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends chromium
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev,web]"
  script:
    - R3XA_CHROMIUM_EXECUTABLE=/usr/bin/chromium python -m pytest -q tests/web/test_browser.py

package:
  stage: package
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip build
  script:
    - |
      python - <<'PY'
      import os
      import tomllib
      from pathlib import Path

      tag = os.environ.get("CI_COMMIT_TAG")
      if tag:
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"Git tag {tag!r} does not match package version {expected!r}")
          print(f"Validated release tag {tag} against package version {version}")
      PY
    - python -m build
    - |
      python - <<'PY'
      from pathlib import Path
      from zipfile import ZipFile

      wheel = next(Path("dist").glob("*.whl"))
      with ZipFile(wheel) as archive:
          names = set(archive.namelist())
      required = {
          "web/app/asgi.py",
          "web/templates/index.html",
          "web/static/app.js",
          "web/static/home.js",
          "web/static/i18n.js",
          "r3xa_api/resources/ui/messages.json",
          "web/static/vendor/json-viewer-js/json-viewer.global.js",
      }
      missing = required - names
      if missing:
          raise SystemExit(f"Wheel is missing web files: {sorted(missing)}")
      print(f"Validated package contents in {wheel.name}")
      PY
    - python -m venv .wheel-venv
    - .wheel-venv/bin/python -m pip install --upgrade pip
    - .wheel-venv/bin/python -m pip install dist/*.whl
    - |
      cd /tmp
      "$CI_PROJECT_DIR/.wheel-venv/bin/python" - <<'PY'
      import r3xa_api
      from r3xa_api import R3XAFile, validate

      assert ".wheel-venv" in r3xa_api.__file__
      payload = R3XAFile(
          title="Wheel smoke test",
          description="Installed package smoke test",
          authors=[{"name": "R3XA_API"}],
          date="2026-01-01",
      ).to_dict()
      validate(payload)
      print("Validated an R3XA payload with the installed wheel")
      PY
  artifacts:
    paths:
      - dist/
