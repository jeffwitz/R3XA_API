workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$/'
    - if: '$CI_COMMIT_MESSAGE =~ /\[ci run\]/'
    - when: never

.full_pipeline_rules: &full_pipeline_rules
  - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
  - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$/'
  - if: '$CI_COMMIT_MESSAGE =~ /\[ci run\]/'
  - when: never

stages:
  - test
  - quality
  - package
  - package-test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

test:
  stage: test
  rules: *full_pipeline_rules
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.10", "3.11", "3.12", "3.13"]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends graphviz
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev,web,graph_nx]"
  script:
    - >-
      python -m pytest -q
      --ignore=tests/web/test_browser.py
      --ignore=tests/web/test_static_build.py
      --ignore=tests/web/test_static_graph.py
      --ignore=tests/web/test_static_parity.py
      --ignore=tests/web/test_static_browser.py
      --junitxml=pytest.xml
  artifacts:
    when: always
    reports:
      junit: pytest.xml

schema-sync:
  stage: quality
  rules: *full_pipeline_rules
  image: python:3.12-slim
  variables:
    R3XA_SPEC_URL: "https://gitlab.com/photomechanics/R3XA_SPEC.git"
    # Pin validation to the exact SPEC commit used to refresh the vendored
    # Pin schema synchronization to the exact source commit used to refresh
    # the packaged schema.
    R3XA_SPEC_REF: "b52621ee15141f75b703ba12f655d82d76ebb036"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
    - python -m pip install --upgrade pip
    - python -m pip install "pytest>=8.0"
  script:
    # The packaged schema is a copy of the one published by R3XA_SPEC. Compare
    # against a fresh clone so a divergence fails here instead of surfacing as a
    # validation error downstream.
    - git init /tmp/R3XA_SPEC
    - git -C /tmp/R3XA_SPEC remote add origin "$R3XA_SPEC_URL"
    - git -C /tmp/R3XA_SPEC fetch --depth 1 origin "$R3XA_SPEC_REF"
    - git -C /tmp/R3XA_SPEC checkout --detach FETCH_HEAD
    # Guard against the test skipping itself if the clone were ever incomplete.
    - test -f /tmp/R3XA_SPEC/schema.json
    - R3XA_SPEC_PATH=/tmp/R3XA_SPEC python -m pytest -q tests/test_schema_sync.py

registry-sync:
  stage: quality
  rules: *full_pipeline_rules
  image: python:3.12-slim
  variables:
    R3XA_REGISTRY_URL: "https://gitlab.com/photomechanics/R3XA_REGISTRY.git"
    # The Registry is the canonical source for reusable items. Keep this as a
    # deliberate integration point when a Registry release changes.
    R3XA_REGISTRY_REF: "c560640d50c9c8ad9a9956069a5fd0b300af04fa"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
  script:
    - git init /tmp/R3XA_REGISTRY
    - git -C /tmp/R3XA_REGISTRY remote add origin "$R3XA_REGISTRY_URL"
    - git -C /tmp/R3XA_REGISTRY fetch --depth 1 origin "$R3XA_REGISTRY_REF"
    - git -C /tmp/R3XA_REGISTRY checkout --detach FETCH_HEAD
    - python /tmp/R3XA_REGISTRY/scripts/validate_all.py
    - python -m pytest -q /tmp/R3XA_REGISTRY/tests

docs:
  stage: quality
  rules: *full_pipeline_rules
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[docs]"
  script:
    - python tools/generate_spec.py r3xa_api/resources/schema.json docs/specification.md
    - python -m sphinx -W --keep-going -b html docs docs/_build/html

lint:
  stage: quality
  rules: *full_pipeline_rules
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
  script:
    - ruff check r3xa_api r3xa_web tests

browser:
  stage: quality
  rules: *full_pipeline_rules
  image: python:3.12-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends chromium
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev,web]"
  script:
    - R3XA_CHROMIUM_EXECUTABLE=/usr/bin/chromium python -m pytest -q tests/web/test_browser.py

static-web-build:
  stage: quality
  rules: *full_pipeline_rules
  image: node:22.23.0-bookworm-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 python3-venv zip
    - python3 -m venv .ci-venv
    - .ci-venv/bin/python -m pip install --upgrade pip
    - .ci-venv/bin/python -m pip install -e ".[web]"
    - npm ci --prefix r3xa_web
  script:
    - npm test --prefix r3xa_web
    - .ci-venv/bin/python scripts/dev.py build-static-web
    - zip -qr "dist/r3xa-webui-${CI_COMMIT_SHORT_SHA}.zip" dist/r3xa-webui
  artifacts:
    paths:
      - dist/r3xa-webui/
      - dist/r3xa-webui-*.zip

static-web-test:
  stage: quality
  rules: *full_pipeline_rules
  image: node:22.23.0-bookworm-slim
  needs:
    - job: static-web-build
      artifacts: true
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 python3-venv chromium
    - python3 -m venv .ci-venv
    - .ci-venv/bin/python -m pip install --upgrade pip
    - .ci-venv/bin/python -m pip install -e ".[dev,web]"
    - npm ci --prefix r3xa_web
  script:
    - R3XA_CHROMIUM_EXECUTABLE=/usr/bin/chromium .ci-venv/bin/python scripts/dev.py test-static-web

package:
  stage: package
  rules: *full_pipeline_rules
  image: python:3.12-slim
  dependencies: []
  before_script:
    - python -m pip install --upgrade pip build
  script:
    - |
      python - <<'PY'
      import os
      import tomllib
      from pathlib import Path

      tag = os.environ.get("CI_COMMIT_TAG")
      if tag:
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"Git tag {tag!r} does not match package version {expected!r}")
          print(f"Validated release tag {tag} against package version {version}")
      PY
    - python -m build
    - |
      python - <<'PY'
      from pathlib import Path
      from zipfile import ZipFile

      wheel = next(Path("dist").glob("*.whl"))
      with ZipFile(wheel) as archive:
          names = set(archive.namelist())
      required = {
          "r3xa_web/app/asgi.py",
          "r3xa_web/templates/index.html",
          "r3xa_web/static/app.js",
          "r3xa_web/static/graph-core.mjs",
          "r3xa_web/static/graph-cytoscape.mjs",
          "r3xa_web/static/graph-runtime.mjs",
          "r3xa_web/static/home.js",
          "r3xa_web/static/i18n.js",
          "r3xa_web/static/registry-storage.js",
          "r3xa_web/static/schema.js",
          "r3xa_web/static/style.css",
          "r3xa_api/resources/schema.json",
          "r3xa_api/resources/ui/messages.json",
          "r3xa_api/resources/graphviz/graphviz-12.2.1.wasm",
      }
      missing = required - names
      if missing:
          raise SystemExit(f"Wheel is missing WebUI files: {sorted(missing)}")
      print(f"Validated package contents in {wheel.name}")
      PY
    - python -m venv .wheel-venv
    - .wheel-venv/bin/python -m pip install --upgrade pip
    - .wheel-venv/bin/python -m pip install dist/*.whl
    - .wheel-venv/bin/python -m pip install "wasmtime>=27"
    - |
      cd /tmp
      "$CI_PROJECT_DIR/.wheel-venv/bin/python" - <<'PY'
      import r3xa_api
      from r3xa_api import R3XAFile, validate
      from r3xa_api.webcore.graph import generate_svg_wasm

      assert ".wheel-venv" in r3xa_api.__file__
      payload = R3XAFile(
          title="Wheel smoke test",
          description="Installed package smoke test",
          authors=[{"name": "R3XA_API"}],
          date="2026-01-01",
      ).to_dict()
      validate(payload)
      svg = generate_svg_wasm(payload)
      assert b"<svg" in svg
      print("Validated an R3XA payload with the installed wheel")
      PY
  artifacts:
    paths:
      - dist/

wheel-smoke:
  stage: package-test
  rules: *full_pipeline_rules
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.10", "3.11", "3.12", "3.13"]
  needs:
    - job: package
      artifacts: true
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install dist/*.whl
  script:
    - |
      cd /tmp
      python - <<'PY'
      import importlib.resources

      import r3xa_api
      from r3xa_api import R3XAFile, validate
      from r3xa_api.webcore.graph import generate_svg_wasm

      resource_root = importlib.resources.files("r3xa_api.resources")
      assert (resource_root / "schema.json").is_file()
      assert (resource_root / "graphviz" / "graphviz-12.2.1.wasm").is_file()
      payload = R3XAFile(
          title="Wheel smoke test",
          description="Installed package smoke test",
          authors=[{"name": "R3XA_API"}],
          date="2026-01-01",
      ).to_dict()
      validate(payload)
      svg = generate_svg_wasm(payload)
      assert b"<svg" in svg
      print(f"Validated installed wheel on Python {r3xa_api.__file__}")
      PY

mr-smoke:
  stage: test
  image: python:3.13-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends graphviz
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev,web,graph_nx]"
  script:
    - >-
      python -m pytest -q
      --ignore=tests/web/test_browser.py
      --ignore=tests/web/test_static_build.py
      --ignore=tests/web/test_static_graph.py
      --ignore=tests/web/test_static_parity.py
      --ignore=tests/web/test_static_browser.py

mr-wheel-smoke:
  stage: package
  image: python:3.13-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - python -m pip install --upgrade pip build
  script:
    - python -m build
    - python -m venv .mr-wheel-venv
    - .mr-wheel-venv/bin/python -m pip install dist/*.whl
    - |
      cd /tmp
      "$CI_PROJECT_DIR/.mr-wheel-venv/bin/python" - <<'PY'
      import importlib.resources

      import r3xa_api
      from r3xa_api import R3XAFile, validate

      resources = importlib.resources.files("r3xa_api.resources")
      assert (resources / "schema.json").is_file()
      payload = R3XAFile(
          title="MR wheel smoke test",
          description="Installed package smoke test",
          authors=[{"name": "R3XA_API"}],
          date="2026-01-01",
      ).to_dict()
      validate(payload)
      print(f"Validated MR wheel with {r3xa_api.__file__}")
      PY

static-pages:
  stage: deploy
  needs:
    - job: static-web-build
      artifacts: true
    - job: static-web-test
      artifacts: false
    - job: test
      artifacts: false
    - job: schema-sync
      artifacts: false
    - job: registry-sync
      artifacts: false
    - job: docs
      artifacts: false
    - job: lint
      artifacts: false
    - job: browser
      artifacts: false
  script:
    - mkdir -p public
    - cp -a dist/r3xa-webui/. public/
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_COMMIT_MESSAGE =~ /\[ci run\]/)'
    - if: '$CI_COMMIT_BRANCH == "develop" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
    - when: never
  artifacts:
    paths:
      - public/

publish-pypi:
  stage: deploy
  image: python:3.12-slim
  dependencies:
    - package
  environment:
    name: pypi
    url: https://pypi.org/project/r3xa-api/
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - python -m pip install --upgrade twine
    - python -m twine check dist/*.whl dist/*.tar.gz
    - python -m twine upload dist/*.whl dist/*.tar.gz
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
      allow_failure: false

publish-pypi-v2-recovery:
  stage: deploy
  image: python:3.12-slim
  needs: []
  dependencies: []
  environment:
    name: pypi
    url: https://pypi.org/project/r3xa-api/
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl unzip
    - python -m pip install --upgrade twine
  script:
    - curl --fail --show-error --location "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/17443479753/artifacts" --output /tmp/r3xa-v2-tag-package.zip
    - unzip -q /tmp/r3xa-v2-tag-package.zip 'dist/r3xa_api-2.0.0-py3-none-any.whl' 'dist/r3xa_api-2.0.0.tar.gz'
    - echo '365bee1051526b00178d342435bd43b022e78cb791112e857a1c5017d1665ffd  dist/r3xa_api-2.0.0-py3-none-any.whl' | sha256sum --check
    - echo 'c7a468c77d7c7cc4becd50289c9d0864ab895b62772e2726bb42da030f6aeffe  dist/r3xa_api-2.0.0.tar.gz' | sha256sum --check
    - python -m twine check dist/*.whl dist/*.tar.gz
    - python -m twine upload dist/*.whl dist/*.tar.gz
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      when: manual
      allow_failure: false
