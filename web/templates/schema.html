<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>R3XA Schema</title>
    <link rel="stylesheet" href="{{ static_base|default('/static') }}/style.css?v={{ app_start }}" />
  </head>
  <body data-app-start="{{ app_start }}">
    <header class="topbar">
      <div class="brand">
        <img
          src="{{ static_base|default('/static') }}/photomeca-logo.png"
          alt="Photomeca"
        />
        <img
          src="{{ static_base|default('/static') }}/r3xa-logo.png"
          alt="R3XA"
        />
        <div>
          <div class="brand-title">Photomeca · R3XA</div>
          <div class="brand-sub">Web Editor & Validator</div>
        </div>
      </div>
      <nav class="nav">
        <a href="{{ app_base|default('') }}/" data-i18n="nav.home">Home</a>
        <a href="{{ app_base|default('') }}/edit/" data-i18n="nav.editor">Editor</a>
        <a href="{{ app_base|default('') }}/registry/" data-i18n="nav.registry">Registry editor</a>
        <label class="language-control"><span data-i18n="language.label">Language</span><select data-language-select><option value="en">English</option><option value="fr">Français</option></select></label>
      </nav>
    </header>

    <main>
      <section class="hero compact">
        <h1 data-i18n="schema.title">Schema viewer</h1>
        <p data-i18n="schema.subtitle">Browse the summarized R3XA JSON schema.</p>
      </section>

      <section class="panel">
        <div class="schema-toolbar">
          <input
            id="schema-filter"
            type="search"
            data-i18n-placeholder="schema.filter_placeholder"
            placeholder="Filter by field name or description…"
          />
          <button id="schema-clear" class="ghost" type="button" data-i18n="schema.clear">Clear</button>
          <label class="schema-toggle">
            <span data-i18n="schema.view">View:</span>
            <select id="schema-view">
              <option value="draft" data-i18n="schema.current_draft">Current draft</option>
              <option value="summary" selected data-i18n="schema.summary">Schema summary</option>
            </select>
          </label>
        </div>
        <div id="schema-tree" role="status" aria-live="polite">Loading schema summary…</div>
      </section>

      <section class="panel">
        <h2 data-i18n="schema.graph">Graph</h2>
        <p class="muted" data-i18n="schema.graph_help">Choose the rendering backend for the current draft.</p>
        <div class="actions">
          <button id="generate-graph-btn" type="button" data-i18n="schema.generate_graph">Generate graph</button>
          <label class="schema-toggle" for="graph-backend">
            <span data-i18n="schema.backend">Backend:</span>
            <select id="graph-backend">
              <option value="graphviz-wasm" selected data-i18n="schema.graphviz_wasm">Graphviz WebAssembly · SVG · Python</option>
              <option value="graphviz" data-i18n="schema.graphviz_native">Graphviz · SVG · system dot</option>
              <option value="cytoscape" data-i18n="schema.cytoscape_browser">Cytoscape.js · interactive browser</option>
              <option value="pyvis" data-i18n="schema.pyvis_browser">PyVis · interactive HTML</option>
              <option value="matplotlib" data-i18n="schema.matplotlib_browser">Matplotlib · SVG · static</option>
            </select>
          </label>
          <label class="schema-toggle">
            <input id="graph-show-description" type="checkbox" checked />
            <span data-i18n="schema.show_descriptions">Show descriptions</span>
          </label>
          <label class="schema-toggle" for="graph-palette">
            <span data-i18n="schema.palette">Palette:</span>
            <select id="graph-palette">
              <option value="document" selected data-i18n="schema.document_palette">Document (recommended)</option>
              <option value="classic" data-i18n="schema.classic_palette">Classic (legacy)</option>
            </select>
          </label>
          <label class="schema-toggle" for="graph-relations">
            <span data-i18n="schema.relations">Relations:</span>
            <select id="graph-relations">
              <option value="all" selected data-i18n="schema.all_relations">All semantic relations</option>
              <option value="dataflow" data-i18n="schema.dataflow_relations">Dataflow only</option>
            </select>
          </label>
          <button id="export-standalone-btn" class="ghost" type="button" data-i18n="schema.export_standalone">Export standalone HTML</button>
          <button id="fullscreen-graph-btn" class="ghost graph-action-hidden" type="button" data-i18n="schema.fullscreen">Fullscreen</button>
          <button id="save-graph-btn" class="ghost graph-action-hidden" type="button" data-i18n="schema.save_graph">Save graph</button>
        </div>
        <div id="graph-container" class="graph-container" role="status" aria-live="polite"></div>
      </section>
    </main>
    <script src="{{ static_base|default('/static') }}/{{ runtime_name|default('runtime.js') }}?v={{ app_start }}" data-asset-base="{{ static_base|default('/static') }}" data-asset-version="{{ app_start }}"></script>
    <script src="{{ static_base|default('/static') }}/i18n.js?v={{ app_start }}"></script>
    <script src="{{ static_base|default('/static') }}/schema.js?v={{ app_start }}"></script>
  </body>
</html>
